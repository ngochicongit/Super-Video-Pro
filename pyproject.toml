[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "super-video-newsvid"
version = "0.11.0"
description = "Local Windows foundation for fact-grounded Vietnamese news video projects"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "trafilatura>=2.0,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]
license-files = [
  "licenses/upstream/Auto-Create-Video-MIT.txt",
  "licenses/upstream/html-video-Apache-2.0.txt",
  "licenses/python/beautifulsoup4-MIT.txt",
  "licenses/python/httpx-BSD-3-Clause.md",
  "licenses/python/playwright-Apache-2.0.txt",
  "licenses/python/trafilatura-Apache-2.0.txt",
  "licenses/javascript/GSAP-3.14.2-NOTICE.md",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
browser = ["playwright>=1.49,<2"]

[project.scripts]
newsvid = "newsvid.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["packages/pipeline/src/newsvid", "packages/article_ingest/src/newsvid_ingest", "packages/brain/src/newsvid_brain"]

[tool.hatch.build.targets.wheel.force-include]
"config/pronunciation_vi.yaml" = "newsvid_brain/data/pronunciation_vi.yaml"
"scripts/render-motion-scene.mjs" = "newsvid/runtime/render-motion-scene.mjs"
"node_modules/gsap/dist/gsap.min.js" = "newsvid/runtime/gsap.min.js"
"workflows/comfyui/news-image.json" = "newsvid/data/comfyui/news-image.json"
"workflows/comfyui/background.json" = "newsvid/data/comfyui/background.json"
"workflows/comfyui/infographic.json" = "newsvid/data/comfyui/infographic.json"

[tool.pytest.ini_options]
testpaths = ["tests/phase0", "tests/phase1", "tests/phase2", "tests/phase3", "tests/phase4", "tests/phase5", "tests/phase6", "tests/phase7", "tests/phase8", "tests/phase9", "tests/phase10", "tests/phase11", "tests/phase14", "tests/phase17"]
addopts = "-q"
markers = ["acceptance: actual local runtime acceptance test"]
