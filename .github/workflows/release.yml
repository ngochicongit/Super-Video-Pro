name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\vendor\playwright-browsers
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version v$version"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@11.19.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install FFmpeg
        run: choco install ffmpeg --yes --no-progress

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create backend environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Prepare bundled runtime tools
        run: node scripts/prepare-tools.mjs

      - name: Verify source and Python pipeline
        shell: pwsh
        run: |
          pnpm verify
          .\.venv\Scripts\python.exe -m pytest -q

      - name: Package Windows installer
        run: pnpm package

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter "Super Video Pro Setup *.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii release\SHA256SUMS.txt

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: super-video-pro-${{ github.ref_name }}-windows
          path: |
            release/Super Video Pro Setup *.exe
            release/Super Video Pro Setup *.exe.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/RELEASE_NOTES_V1.13.0.md"
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Name -like "Super Video Pro Setup *.exe" -or $_.Name -like "Super Video Pro Setup *.exe.blockmap" -or $_.Name -eq "SHA256SUMS.txt" } | ForEach-Object FullName)
          gh release create "${{ github.ref_name }}" @assets --title "Super Video Pro ${{ github.ref_name }}" --notes-file $notes --verify-tag
